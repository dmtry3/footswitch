<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Looper Display</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #2196F3; color: white; border: none; border-radius: 6px; margin-bottom: 20px; cursor: pointer; }
    .looper-container { position: relative; width: 90vw; height: 100px; background: #111; border-radius: 8px; overflow: hidden; border: 2px solid #333; }
    #base-progress { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: rgba(76, 175, 80, 0.85); transition: width 0.03s linear; }
    #events-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>

  <button id="connectBtn">Подключить ESP32 (BLE)</button>

  <div class="looper-container">
    <div id="base-progress"></div>
    <div id="events-layer"></div>
  </div>

<script>
  const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
  const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

  const baseProgress = document.getElementById('base-progress');
  const eventsLayer = document.getElementById('events-layer');
  const connectBtn = document.getElementById('connectBtn');

  connectBtn.addEventListener('click', function() {
    connectBtn.innerText = "Подключение...";
    
    navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    })
    .then(device => {
      console.log('Устройство выбрано:', device.name);
      return device.gatt.connect();
    })
    .then(server => {
      return server.getPrimaryService(SERVICE_UUID);
    })
    .then(service => {
      return service.getCharacteristic(CHARACTERISTIC_UUID);
    })
    .then(characteristic => {
      return characteristic.startNotifications().then(() => {
        characteristic.addEventListener('characteristicvaluechanged', handleData);
        connectBtn.innerText = "Подключено!";
        connectBtn.style.background = "#4CAF50";
      });
    })
    .catch(error => {
      console.error("Ошибка BLE:", error);
      connectBtn.innerText = "Ошибка. Попробовать снова";
      connectBtn.style.background = "#F44336";
    });
  });

  function handleData(event) {
    const decoder = new TextDecoder('utf-8');
    const text = decoder.decode(event.target.value).trim();
    const parts = text.split(' ');
    const cmd = parts[0];
    const val = parseFloat(parts[1]) || 0;

    if (cmd === '/pos' && baseProgress) {
      baseProgress.style.width = (val * 100) + '%';
    } else if (cmd === '/note' && eventsLayer) {
      const noteEl = document.createElement('div');
      noteEl.style.cssText = 'position:absolute; left:' + (val * 100) + '%; top:0; width:3px; height:100%; background:#FFEB3B;';
      eventsLayer.appendChild(noteEl);
    } else if (cmd === '/cc' && eventsLayer) {
      const ccEl = document.createElement('div');
      ccEl.style.cssText = 'position:absolute; left:' + (val * 100) + '%; top:0; width:2px; height:100%; background:#9C27B0;';
      eventsLayer.appendChild(ccEl);
    } else if (cmd === '/reset') {
      if (baseProgress) baseProgress.style.width = '0%';
      if (eventsLayer) eventsLayer.innerHTML = '';
    }
  }
</script>
</body>
</html>
